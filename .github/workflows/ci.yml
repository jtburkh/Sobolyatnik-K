name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Package telemetry bridge
        run: |
          python3 tools/package_telemetry_mod.py
          unzip -t dist/RtVTelemetryProof.vmz
          unzip -p dist/RtVTelemetryProof.vmz mod.txt | grep -F 'version="0.8.3"'
          unzip -p dist/RtVTelemetryProof.vmz RtVTelemetryProof/Main.gd | grep -F 'var _diagnostic_profile := "player_only"'
          unzip -p dist/RtVTelemetryProof.vmz RtVTelemetryProof/Main.gd | grep -F 'TRACE_LIMIT_BYTES := 2 * 1024 * 1024'
          ! unzip -p dist/RtVTelemetryProof.vmz mod.txt | grep -F 'res://Scripts/AI.gd'
          unzip -Z1 dist/RtVTelemetryProof.vmz | grep -Fx 'RtVTelemetryProof/CerebralMultiplier.tscn'
          unzip -Z1 dist/RtVTelemetryProof.vmz | grep -Fx 'RtVTelemetryProof/RadarOverlay.gd'

      - name: Package isolated loader controls (not release assets)
        run: |
          python3 tools/package_loader_probes.py
          unzip -t dist/probes/RtVLoaderBaseline.vmz
          unzip -t dist/probes/RtVInertAutoload.vmz
          test "$(unzip -Z1 dist/probes/RtVLoaderBaseline.vmz)" = mod.txt
          unzip -Z1 dist/probes/RtVInertAutoload.vmz | grep -Fx 'RtVInertProbe.gd'

      - name: Package radar-lite isolation candidate (not a release asset)
        run: |
          python3 tools/package_radar_lite.py
          unzip -t dist/probes/RtVRadarLite.vmz
          unzip -t dist/probes/RtVRadarContacts.vmz
          unzip -t dist/probes/RtVRadarInGame.vmz
          unzip -t dist/probes/RtVRadarControls.vmz
          unzip -t dist/probes/RtVRadarLoot.vmz
          unzip -p dist/probes/RtVRadarLite.vmz mod.txt | grep -F 'version="0.1.8"'
          unzip -p dist/probes/RtVRadarLite.vmz RtVRadarLite.gd | grep -F 'const CONTACTS_DEFAULT := false'
          unzip -p dist/probes/RtVRadarContacts.vmz RtVRadarLite.gd | grep -F 'const CONTACTS_DEFAULT := true'
          ! unzip -p dist/probes/RtVRadarLite.vmz RtVRadarLite.gd | grep -F 'func _input'
          ! unzip -p dist/probes/RtVRadarContacts.vmz RtVRadarLite.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLite.gd | grep -F 'const OVERLAY_DEFAULT := true'
          unzip -Z1 dist/probes/RtVRadarInGame.vmz | grep -Fx 'RtVRadarLiteOverlay.gd'
          unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLiteOverlay.gd | grep -F 'mouse_filter = Control.MOUSE_FILTER_IGNORE'
          ! unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLite.gd | grep -F 'const CONTROLS_DEFAULT := true'
          unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLiteOverlay.gd | grep -F 'func cycle_layers()'
          ! unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLite.gd | grep -F 'func _input'
          ! unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLite.gd | grep -F 'const LOOT_DEFAULT := true'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLite.gd | grep -F 'func _collect_loot('
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'func _draw_loot('
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'color, false, 1.2)'
          unzip -p dist/probes/RtVRadarLoot.vmz mod.txt | grep -F 'name="Sobolyatnik-K (Sable Hunter) Experimental — 1L108K"'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F '"SOBOLYATNIK-K"'
          ! unzip -p dist/probes/RtVRadarLoot.vmz mod.txt | grep -F 'res://Scripts/AI.gd'
          ! unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          echo '66fd97a4c1487be6688ef94b59ee709a3baa8c7886c490d2f03af7b8c395eefc  dist/probes/RtVRadarLoot.vmz' | sha256sum -c -
      - name: Share exact verified VMZ with Windows fixture tests
        uses: actions/upload-artifact@v4
        with:
          name: pinned-radar-vmz
          path: dist/probes/RtVRadarLoot.vmz
          if-no-files-found: error

  toolkit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows Toolkit executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Test Windows Toolkit and CLI entry point
        shell: powershell
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust tests failed' }
          $exe = 'target/x86_64-pc-windows-msvc/release/rtv-toolkit.exe'
          $helpText = & $exe --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'rtv-toolkit --check') { throw 'Toolkit help smoke failed' }
          Write-Host "Windows Toolkit SHA-256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Preserve tested Windows Toolkit binary
        uses: actions/upload-artifact@v4
        with:
          name: rtv-toolkit-windows-x64
          path: target/x86_64-pc-windows-msvc/release/rtv-toolkit.exe
          if-no-files-found: error

  installer:
    needs: [quality, toolkit-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pinned-radar-vmz
          path: dist/probes
      - uses: actions/download-artifact@v4
        with:
          name: rtv-toolkit-windows-x64
          path: dist/windows
      - name: Verify the tested VMZ (do not rebuild with a different zlib)
        shell: powershell
        run: |
          if ((Get-FileHash dist/probes/RtVRadarLoot.vmz -Algorithm SHA256).Hash -ne '66FD97A4C1487BE6688EF94B59EE709A3BAA8C7886C490D2F03AF7B8C395EEFC') { throw 'Radar VMZ hash mismatch' }
      - name: Obtain pinned upstream Metro fixture files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/metro | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ametrocavich/vostok-mod-loader/releases/download/v3.2.1/modloader.gd' -OutFile dist/metro/modloader.gd
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ametrocavich/vostok-mod-loader/releases/download/v3.2.1/override.cfg' -OutFile dist/metro/override.cfg
          if ((Get-FileHash dist/metro/modloader.gd -Algorithm SHA256).Hash -ne '60FCF7FEEC0A47C6472E3B7A190B46987B374618AE3D149C081B222542BC6135') { throw 'Metro script hash mismatch' }
          if ((Get-FileHash dist/metro/override.cfg -Algorithm SHA256).Hash -ne '9750A66FCF0CB1D9BF84284271F52E064F455CDD5A1CDC4981A007E4011A684B') { throw 'Metro override hash mismatch' }
      - name: Check radar-only installer against disposable Steam libraries
        shell: powershell
        run: ./tests/installer/smoke.ps1 -ArchivePath ./dist/probes/RtVRadarLoot.vmz -LoaderSourceDirectory ./dist/metro -TestLoaderDownload
      - name: Render reviewed bundle template with tested Windows EXE
        run: python tools/render_bundle_installer.py --toolkit dist/windows/rtv-toolkit.exe --output dist/windows/setup-sobolyatnik.ps1
      - name: Check complete bundle, Windows entries, and safe uninstall
        shell: powershell
        run: ./tests/installer/bundle-smoke.ps1 -ArchivePath ./dist/probes/RtVRadarLoot.vmz -LoaderSourceDirectory ./dist/metro -FakeToolkitPath ./dist/windows/rtv-toolkit.exe -RenderedInstaller ./dist/windows/setup-sobolyatnik.ps1 -TestIntegration -CheckToolkitHelp
