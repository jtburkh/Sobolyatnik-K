name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

      - name: Check Build 2 catalog consistency
        run: python3 -m unittest discover -s tests/catalog -p 'test_*.py'

      - name: Check synthetic Steam build gate fixtures (offline only)
        run: python3 -m unittest discover -s tests/steam -p 'test_*.py'

      - name: Package telemetry bridge
        run: |
          python3 tools/package_telemetry_mod.py
          unzip -t dist/RtVTelemetryProof.vmz
          unzip -p dist/RtVTelemetryProof.vmz mod.txt | grep -F 'version="0.8.3"'
          unzip -p dist/RtVTelemetryProof.vmz RtVTelemetryProof/Main.gd | grep -F 'var _diagnostic_profile := "player_only"'
          unzip -p dist/RtVTelemetryProof.vmz RtVTelemetryProof/Main.gd | grep -F 'TRACE_LIMIT_BYTES := 2 * 1024 * 1024'
          ! unzip -p dist/RtVTelemetryProof.vmz mod.txt | grep -F 'res://Scripts/AI.gd'
          unzip -Z1 dist/RtVTelemetryProof.vmz | grep -Fx 'RtVTelemetryProof/CerebralMultiplier.tscn'
          unzip -Z1 dist/RtVTelemetryProof.vmz | grep -Fx 'RtVTelemetryProof/RadarOverlay.gd'

      - name: Package isolated loader controls (not release assets)
        run: |
          python3 tools/package_loader_probes.py
          unzip -t dist/probes/RtVLoaderBaseline.vmz
          unzip -t dist/probes/RtVInertAutoload.vmz
          test "$(unzip -Z1 dist/probes/RtVLoaderBaseline.vmz)" = mod.txt
          unzip -Z1 dist/probes/RtVInertAutoload.vmz | grep -Fx 'RtVInertProbe.gd'

      - name: Package radar-lite isolation candidate (not a release asset)
        run: |
          python3 tools/package_radar_lite.py
          unzip -t dist/probes/RtVRadarLite.vmz
          unzip -t dist/probes/RtVRadarContacts.vmz
          unzip -t dist/probes/RtVRadarInGame.vmz
          unzip -t dist/probes/RtVRadarControls.vmz
          unzip -t dist/probes/RtVRadarLoot.vmz
          unzip -p dist/probes/RtVRadarLite.vmz mod.txt | grep -F 'version="0.1.8"'
          unzip -p dist/probes/RtVRadarLite.vmz RtVRadarLite.gd | grep -F 'const CONTACTS_DEFAULT := false'
          unzip -p dist/probes/RtVRadarContacts.vmz RtVRadarLite.gd | grep -F 'const CONTACTS_DEFAULT := true'
          ! unzip -p dist/probes/RtVRadarLite.vmz RtVRadarLite.gd | grep -F 'func _input'
          ! unzip -p dist/probes/RtVRadarContacts.vmz RtVRadarLite.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLite.gd | grep -F 'const OVERLAY_DEFAULT := true'
          unzip -Z1 dist/probes/RtVRadarInGame.vmz | grep -Fx 'RtVRadarLiteOverlay.gd'
          unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLiteOverlay.gd | grep -F 'mouse_filter = Control.MOUSE_FILTER_IGNORE'
          ! unzip -p dist/probes/RtVRadarInGame.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLite.gd | grep -F 'const CONTROLS_DEFAULT := true'
          unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLiteOverlay.gd | grep -F 'func cycle_layers()'
          ! unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLite.gd | grep -F 'func _input'
          ! unzip -p dist/probes/RtVRadarControls.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLite.gd | grep -F 'const LOOT_DEFAULT := true'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLite.gd | grep -F 'func _collect_loot('
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'func _draw_loot('
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'color, false, 1.2)'
          unzip -p dist/probes/RtVRadarLoot.vmz mod.txt | grep -F 'name="Sobolyatnik-K (Sable Hunter) Experimental — 1L108K"'
          unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F '"SOBOLYATNIK-K"'
          ! unzip -p dist/probes/RtVRadarLoot.vmz mod.txt | grep -F 'res://Scripts/AI.gd'
          ! unzip -p dist/probes/RtVRadarLoot.vmz RtVRadarLiteOverlay.gd | grep -F 'func _input'
          echo '66fd97a4c1487be6688ef94b59ee709a3baa8c7886c490d2f03af7b8c395eefc  dist/probes/RtVRadarLoot.vmz' | sha256sum -c -

      - name: Package isolated Shot Alerts source candidate (not a release asset)
        run: |
          python3 tools/package_radar_shots.py
          unzip -t dist/probes/RtVRadarShotsCandidate.vmz
          unzip -Z1 dist/probes/RtVRadarShotsCandidate.vmz | grep -Fx 'RtVRadarShotBridge.gd'
          unzip -p dist/probes/RtVRadarShotsCandidate.vmz RtVRadarLiteOverlay.gd | grep -F 'var _layer_mode := 0 # Default Shot Alerts'
          unzip -p dist/probes/RtVRadarShotsCandidate.vmz RtVRadarLiteOverlay.gd | grep -F '"SHOT ALERTS", "ALL+SHOTS", "AI ONLY", "TRAILS ONLY", "LOOT ONLY"'
          ! unzip -p dist/probes/RtVRadarShotsCandidate.vmz RtVRadarShotBridge.gd | grep -F '.hook('
          ! unzip -p dist/probes/RtVRadarShotsCandidate.vmz mod.txt | grep -F 'res://Scripts/AI.gd'
          echo '66fd97a4c1487be6688ef94b59ee709a3baa8c7886c490d2f03af7b8c395eefc  dist/probes/RtVRadarLoot.vmz' | sha256sum -c -
      - name: Package unreleased range preview (not a release or installer asset)
        run: |
          python3 tools/package_radar_range.py
          unzip -t dist/probes/RtVRadarRangeCandidate.vmz
          unzip -p dist/probes/RtVRadarRangeCandidate.vmz mod.txt | grep -F 'id="rtv_toolkit_radar_range_candidate"'
          unzip -p dist/probes/RtVRadarRangeCandidate.vmz RtVRadarLiteOverlay.gd | grep -F 'const RANGES_METRES := [50.0, 100.0, 200.0, 400.0]'
          ! unzip -p dist/probes/RtVRadarRangeCandidate.vmz RtVRadarShotBridge.gd | grep -F '.hook('
      - name: Share unreleased range preview for controlled owner testing
        uses: actions/upload-artifact@v4
        with:
          name: UNRELEASED-radar-range-preview-vmz
          path: dist/probes/RtVRadarRangeCandidate.vmz
          if-no-files-found: error
          retention-days: 30
      - name: Package the separately versioned Shot Alerts release bytes
        run: |
          python3 tools/package_radar_shots_release.py
          echo '6d2d06e55831f174483595d44fde6ba5c3a50f7fec183d2c66a5953ecb98efdd  dist/probes/RtVRadarShotsRelease.vmz' | sha256sum -c -
          echo 'cf66879c05c3a8404458e24b1e75f6943895c604a497398551db8535ba01c39d  tools/install-sobolyatnik-v0.1.12.ps1' | sha256sum -c -
          echo '9a0620b45a1c62395c2cf3dc897efcd30f9600a517e8922a648e1257cadcb877  tools/uninstall-sobolyatnik-v0.1.12.ps1' | sha256sum -c -
          unzip -t dist/probes/RtVRadarShotsRelease.vmz
          unzip -p dist/probes/RtVRadarShotsRelease.vmz mod.txt | grep -F 'version="0.1.12"'
          unzip -p dist/probes/RtVRadarShotsRelease.vmz mod.txt | grep -F 'id="rtv_toolkit_radar_loot"'
          unzip -p dist/probes/RtVRadarShotsRelease.vmz RtVRadarLiteOverlay.gd | grep -F 'var _layer_mode := 0 # Default Shot Alerts'
          ! unzip -p dist/probes/RtVRadarShotsRelease.vmz RtVRadarShotBridge.gd | grep -F '.hook('
      - name: Share exact verified VMZ with Windows fixture tests
        uses: actions/upload-artifact@v4
        with:
          name: pinned-radar-vmz
          path: dist/probes/RtVRadarLoot.vmz
          if-no-files-found: error
      - name: Share exact versioned release VMZ with Windows fixture tests
        uses: actions/upload-artifact@v4
        with:
          name: shot-alerts-release-vmz
          path: dist/probes/RtVRadarShotsRelease.vmz
          if-no-files-found: error
      - name: Share exact LF-versioned PowerShell scripts with Windows fixture tests
        uses: actions/upload-artifact@v4
        with:
          name: shot-alerts-installer-scripts
          path: |
            tools/install-sobolyatnik-v0.1.12.ps1
            tools/uninstall-sobolyatnik-v0.1.12.ps1
          if-no-files-found: error

  toolkit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows Toolkit executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Test Windows Toolkit and CLI entry point
        shell: powershell
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust tests failed' }
          $exe = 'target/x86_64-pc-windows-msvc/release/rtv-toolkit.exe'
          $helpText = & $exe --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'rtv-toolkit --check') { throw 'Toolkit help smoke failed' }
          Write-Host "Windows Toolkit SHA-256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Preserve tested Windows Toolkit binary
        uses: actions/upload-artifact@v4
        with:
          name: UNRELEASED-rtv-toolkit-windows-x64
          path: target/x86_64-pc-windows-msvc/release/rtv-toolkit.exe
          if-no-files-found: error
          retention-days: 30

  toolkit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux/WSL preview (restore remains Windows-only)
        run: cargo build --locked --release
      - name: Check CLI entry point
        run: ./target/release/rtv-toolkit --help | grep -F 'rtv-toolkit --check'
      - name: Share unreleased Linux/WSL preview for owner testing
        uses: actions/upload-artifact@v4
        with:
          name: UNRELEASED-rtv-toolkit-linux-x64
          path: target/release/rtv-toolkit
          if-no-files-found: error
          retention-days: 30

  installer:
    needs: [quality, toolkit-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pinned-radar-vmz
          path: dist/probes
      - uses: actions/download-artifact@v4
        with:
          name: shot-alerts-release-vmz
          path: dist/shot-alerts
      - uses: actions/download-artifact@v4
        with:
          name: shot-alerts-installer-scripts
          path: dist/shot-alerts
      - uses: actions/download-artifact@v4
        with:
          name: UNRELEASED-rtv-toolkit-windows-x64
          path: dist/windows
      - name: Verify the tested VMZ (do not rebuild with a different zlib)
        shell: powershell
        run: |
          if ((Get-FileHash dist/probes/RtVRadarLoot.vmz -Algorithm SHA256).Hash -ne '66FD97A4C1487BE6688EF94B59EE709A3BAA8C7886C490D2F03AF7B8C395EEFC') { throw 'Radar VMZ hash mismatch' }
      - name: Obtain pinned upstream Metro fixture files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/metro | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ametrocavich/vostok-mod-loader/releases/download/v3.2.1/modloader.gd' -OutFile dist/metro/modloader.gd
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ametrocavich/vostok-mod-loader/releases/download/v3.2.1/override.cfg' -OutFile dist/metro/override.cfg
          if ((Get-FileHash dist/metro/modloader.gd -Algorithm SHA256).Hash -ne '60FCF7FEEC0A47C6472E3B7A190B46987B374618AE3D149C081B222542BC6135') { throw 'Metro script hash mismatch' }
          if ((Get-FileHash dist/metro/override.cfg -Algorithm SHA256).Hash -ne '9750A66FCF0CB1D9BF84284271F52E064F455CDD5A1CDC4981A007E4011A684B') { throw 'Metro override hash mismatch' }
      - name: Check radar-only installer against disposable Steam libraries
        shell: powershell
        run: ./tests/installer/smoke.ps1 -ArchivePath ./dist/probes/RtVRadarLoot.vmz -LoaderSourceDirectory ./dist/metro -TestLoaderDownload
      - name: Obtain exact pinned v0.1.8 installer (Windows checkout normalizes line endings)
        shell: powershell
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jtburkh/Sobolyatnik-K/releases/download/v0.1.8-experimental/install-sobolyatnik.ps1' -OutFile dist/windows/install-sobolyatnik-v0.1.8.ps1
          if ((Get-FileHash dist/windows/install-sobolyatnik-v0.1.8.ps1 -Algorithm SHA256).Hash -ne 'FC8B4D38F2373B750BD9457BD3D779A5CE613E541F6643AEFFD99634B3F0DF72') { throw 'Legacy radar installer hash mismatch' }
      - name: Obtain pinned v0.1.9 bundle for safe migration fixture
        shell: powershell
        run: |
          $assets = @(
            @{ Name = 'setup-sobolyatnik-v0.1.9.ps1'; Hash = 'C7F5D7BEB4355840875BB32CE7DDED0C0451B56E3D51B3B5648129BE6F91F2AC'; Remote = 'setup-sobolyatnik.ps1' },
            @{ Name = 'uninstall-sobolyatnik-v0.1.9.ps1'; Hash = '38CAA7F514EC19E5BECDD948D48D14BD7447AAD37E35650F08AF4952116821A1'; Remote = 'uninstall-sobolyatnik.ps1' },
            @{ Name = 'rtv-toolkit-v0.1.9.exe'; Hash = '5E8D95FDA3208AECDA403CFFE68578E5965FD59B0145B71FD390C991F244EFA4'; Remote = 'rtv-toolkit.exe' }
          )
          foreach ($asset in $assets) {
            $path = Join-Path dist/windows $asset.Name
            Invoke-WebRequest -UseBasicParsing -Uri ('https://github.com/jtburkh/Sobolyatnik-K/releases/download/v0.1.9-experimental/' + $asset.Remote) -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ine $asset.Hash) { throw "Previous bundle asset hash mismatch: $($asset.Name)" }
          }
      - name: Render reviewed bundle template with tested Windows EXE
        run: python tools/render_bundle_installer.py --toolkit dist/windows/rtv-toolkit.exe --output dist/windows/setup-sobolyatnik.ps1
      - name: Check complete legacy bundle, Windows entries, and safe uninstall
        shell: powershell
        run: ./tests/installer/bundle-smoke.ps1 -ArchivePath ./dist/probes/RtVRadarLoot.vmz -LoaderSourceDirectory ./dist/metro -FakeToolkitPath ./dist/windows/rtv-toolkit.exe -RenderedInstaller ./dist/windows/setup-sobolyatnik.ps1 -RadarInstallerPath ./dist/windows/install-sobolyatnik-v0.1.8.ps1 -TestIntegration -CheckToolkitHelp
      - name: Render and check new Build 2 bundle in disposable Steam fixture
        shell: powershell
        run: |
          python tools/render_bundle_installer.py --toolkit dist/windows/rtv-toolkit.exe --template tools/setup-sobolyatnik-v0.1.11.ps1.in --uninstaller tools/uninstall-sobolyatnik-v0.1.11.ps1 --output dist/windows/setup-sobolyatnik-v0.1.11.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to render Build 2 installer' }
          ./tests/installer/bundle-smoke.ps1 -ArchivePath ./dist/probes/RtVRadarLoot.vmz -LoaderSourceDirectory ./dist/metro -FakeToolkitPath ./dist/windows/rtv-toolkit.exe -RenderedInstaller ./dist/windows/setup-sobolyatnik-v0.1.11.ps1 -RadarInstallerPath ./dist/windows/install-sobolyatnik-v0.1.8.ps1 -UninstallerPath ./tools/uninstall-sobolyatnik-v0.1.11.ps1 -PreviousBundleInstallerPath ./dist/windows/setup-sobolyatnik-v0.1.9.ps1 -PreviousBundleToolkitPath ./dist/windows/rtv-toolkit-v0.1.9.exe -PreviousBundleUninstallerPath ./dist/windows/uninstall-sobolyatnik-v0.1.9.ps1 -TestIntegration -CheckToolkitHelp
      - name: Obtain pinned published v0.1.11 bundle for Shot Alerts migration fixture
        shell: powershell
        run: |
          $assets = @(
            @{ Name = 'setup-sobolyatnik-v0.1.11-published.ps1'; Hash = 'A2CBBFA5AA1D6CCC6DA9B664CAD29ECD9A0B1BC4FDA6054E29FDF4BE13E98388'; Remote = 'setup-sobolyatnik.ps1' },
            @{ Name = 'uninstall-sobolyatnik-v0.1.11-published.ps1'; Hash = '27088ABFC7D10040BF624FD79B47CA99DD7A7D2B0EB7C33310E91D41A044209D'; Remote = 'uninstall-sobolyatnik.ps1' },
            @{ Name = 'rtv-toolkit-v0.1.11-published.exe'; Hash = 'C0D0D08528465D574666F3956A41D3AE7F17B810679BB9AE5F48DFF8F2C732A3'; Remote = 'rtv-toolkit.exe' }
          )
          foreach ($asset in $assets) {
            $path = Join-Path dist/windows $asset.Name
            Invoke-WebRequest -UseBasicParsing -Uri ('https://github.com/jtburkh/Sobolyatnik-K/releases/download/v0.1.11-experimental/' + $asset.Remote) -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ine $asset.Hash) { throw "Published v0.1.11 asset hash mismatch: $($asset.Name)" }
          }
      - name: Check exact new Shot Alerts radar installer in disposable Steam fixture
        shell: powershell
        run: ./tests/installer/smoke.ps1 -InstallerPath ./dist/shot-alerts/install-sobolyatnik-v0.1.12.ps1 -ArchivePath ./dist/shot-alerts/RtVRadarShotsRelease.vmz -LoaderSourceDirectory ./dist/metro -ExpectedRadarHash 6D2D06E55831F174483595D44FDE6BA5C3A50F7FEC183D2C66A5953ECB98EFDD
      - name: Render and check versioned Shot Alerts bundle and v0.1.11 migration
        shell: powershell
        run: |
          python tools/render_bundle_installer.py --toolkit dist/windows/rtv-toolkit.exe --template tools/setup-sobolyatnik-v0.1.12.ps1.in --uninstaller dist/shot-alerts/uninstall-sobolyatnik-v0.1.12.ps1 --output dist/windows/setup-sobolyatnik-v0.1.12.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to render Shot Alerts installer' }
          ./tests/installer/bundle-smoke.ps1 -ArchivePath ./dist/shot-alerts/RtVRadarShotsRelease.vmz -LoaderSourceDirectory ./dist/metro -FakeToolkitPath ./dist/windows/rtv-toolkit.exe -RenderedInstaller ./dist/windows/setup-sobolyatnik-v0.1.12.ps1 -RadarInstallerPath ./dist/shot-alerts/install-sobolyatnik-v0.1.12.ps1 -UninstallerPath ./dist/shot-alerts/uninstall-sobolyatnik-v0.1.12.ps1 -PreviousBundleInstallerPath ./dist/windows/setup-sobolyatnik-v0.1.11-published.ps1 -PreviousBundleToolkitPath ./dist/windows/rtv-toolkit-v0.1.11-published.exe -PreviousBundleUninstallerPath ./dist/windows/uninstall-sobolyatnik-v0.1.11-published.ps1 -PreviousBundleRadarInstallerPath ./dist/windows/install-sobolyatnik-v0.1.8.ps1 -PreviousBundleArchivePath ./dist/probes/RtVRadarLoot.vmz -PreviousBundleVersion 0.1.11-experimental -ExpectedBundleVersion 0.1.12-experimental -ExpectedRadarHash 6D2D06E55831F174483595D44FDE6BA5C3A50F7FEC183D2C66A5953ECB98EFDD -TestIntegration -CheckToolkitHelp
