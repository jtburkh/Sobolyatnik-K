[package]
name = "rtv-toolkit"
version = "0.1.18-experimental.1"
edition = "2024"
description = "A safe Ratatui inventory editor for Road to Vostok"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
